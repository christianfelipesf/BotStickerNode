# Nginx — botantigravity.duckdns.org → localhost:3000
# Coloque em /etc/nginx/sites-available/botantigravity.duckdns.org
# ou em /etc/nginx/conf.d/botantigravity.conf (Linux / Docker)
# Domínio DuckDNS: botantigravity.duckdns.org  |  Upstream: dashboard na porta 3000

upstream dashboard {
    server 127.0.0.1:3000;
    # Se usar Docker Compose com serviço "whatsapp-bot", troque para:
    # server whatsapp-bot:3000;
}

# HTTP — apenas para Let’s Encrypt + redirect
server {
    listen 80;
    listen [::]:80;
    server_name botantigravity.duckdns.org;

    # Certbot / win-acme precisa acessar
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        # Windows (nginx for Windows): root C:/nginx/html;
        # ou root C:/Certbot/.well-known/acme-challenge;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — proxy reverso para o dashboard
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name botantigravity.duckdns.org;

    # Certs gerados pelo Certbot
    ssl_certificate /etc/letsencrypt/live/botantigravity.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/botantigravity.duckdns.org/privkey.pem;
    # Windows com win-acme: aponte para onde o win-acme exportou (ex C:/nginx/certs/...)
    # ssl_certificate C:/nginx/certs/botantigravity.duckdns.org/fullchain.pem;
    # ssl_certificate_key C:/nginx/certs/botantigravity.duckdns.org/privkey.pem;

    ssl_trusted_certificate /etc/letsencrypt/live/botantigravity.duckdns.org/chain.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozTLS:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    # Logs
    access_log /var/log/nginx/botantigravity.access.log;
    error_log /var/log/nginx/botantigravity.error.log;

    # Tamanho max upload (dashboard envia mídia até 20mb)
    client_max_body_size 25m;

    location / {
        proxy_pass http://dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        # Necessário para Express trust proxy + rate-limit correto
    }

    # Socket.IO precisa de websocket
    location /socket.io/ {
        proxy_pass http://dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
