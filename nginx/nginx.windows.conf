# nginx.conf completo para Windows (C:\nginx\conf\nginx.conf)
# Substitua o arquivo original por este. Já inclui o site botantigravity.duckdns.org
# Requer: nginx for Windows em C:\nginx\  e dash rodando em 127.0.0.1:3000
# Certs: ajuste ssl_certificate se usar win-acme (ver comentário abaixo)

worker_processes  1;
error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 25m;

    # Logs no padrão nginx Windows
    access_log  logs/access.log;
    error_log   logs/error.log;

    # Map para websocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # HTTP — redirect + ACME
    server {
        listen       80;
        server_name  botantigravity.duckdns.org;

        location /.well-known/acme-challenge/ {
            root html;
            # win-acme usa por padrão C:\ProgramData\win-acme\  — se usar webroot, aponte aqui
            # Crie pasta C:\nginx\html\.well-known\acme-challenge\  e aponte o win-acme para ela
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS — proxy para dashboard
    server {
        listen       443 ssl;
        server_name  botantigravity.duckdns.org;

        # === CERTS — escolha UM dos dois blocos ===

        # A) win-acme (recomendado no Windows): após rodar wacs.exe, ele salva em
        #    C:\ProgramData\win-acme\acme\... ou exporta para C:\nginx\certs\
        #    Descomente e ajuste o caminho real que o wacs.exe mostrar:
        # ssl_certificate      C:/nginx/certs/botantigravity.duckdns.org/fullchain.pem;
        # ssl_certificate_key  C:/nginx/certs/botantigravity.duckdns.org/privkey.pem;

        # B) Certbot standalone (se gerou via certbot certonly --standalone):
        #    Certs ficam em C:\Certbot\live\botantigravity.duckdns.org\
        ssl_certificate      C:/Certbot/live/botantigravity.duckdns.org/fullchain.pem;
        ssl_certificate_key  C:/Certbot/live/botantigravity.duckdns.org/privkey.pem;

        ssl_session_timeout  1d;
        ssl_session_cache    shared:MozTLS:10m;
        ssl_session_tickets  off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        add_header Strict-Transport-Security "max-age=63072000" always;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        location /socket.io/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
        }
    }
}
